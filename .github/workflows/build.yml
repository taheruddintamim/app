name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Prepare environment files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app

          if [ -f ".env.example" ]; then
            cp ".env.example" "app/.env.example"
            echo "Created app/.env.example"
          else
            echo "ERROR: .env.example is missing from repository root."
            exit 1
          fi

          if [ -f ".env" ]; then
            cp ".env" "app/.env"
            echo "Created app/.env"
          else
            touch "app/.env"
            echo "Created empty app/.env"
          fi

      - name: Prepare debug keystore
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          test -f "$GITHUB_WORKSPACE/debug.keystore"

      - name: Remove incomplete Google Services config
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "app/google-services.json" ]; then
            echo "Removing repository Google Services config for CI debug build."
            rm -f "app/google-services.json"
          else
            echo "No google-services.json present."
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/debug \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          echo "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: taher-service-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
