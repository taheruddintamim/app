name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          test -f "$GITHUB_WORKSPACE/debug.keystore"

      - name: Handle Google Services config
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "app/google-services.json" ]; then
            python3 - <<'PY'
          import json
          import sys

          path = "app/google-services.json"
          expected = "com.aistudio.taherservicestudio.zqvmkl"

          try:
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception:
              print("Invalid google-services.json. Removing it.")
              sys.exit(10)

          found = False

          for client in data.get("client", []):
              package_name = (
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package_name == expected:
                  found = True
                  break

          if not found:
              print("No matching Firebase client found. Removing google-services.json.")
              sys.exit(10)

          print("Matching google-services.json found.")
          PY

            RESULT=$?

            if [ "$RESULT" -eq 10 ]; then
              rm -f app/google-services.json
            elif [ "$RESULT" -ne 0 ]; then
              exit "$RESULT"
            fi
          else
            echo "google-services.json not present. Continuing."
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/debug \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          echo "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: taher-service-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
