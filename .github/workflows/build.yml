name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Ensure Gradle wrapper exists
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "./gradlew" ] || [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Gradle wrapper is incomplete."
            echo "Generating Gradle 9.3.1 wrapper..."

            gradle wrapper \
              --gradle-version 9.3.1 \
              --distribution-type bin
          fi

          chmod +x ./gradlew

          sed -i \
            's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip#' \
            gradle/wrapper/gradle-wrapper.properties

          ./gradlew --version

      - name: Prepare debug keystore
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "./debug.keystore" ]; then
            keytool \
              -genkeypair \
              -v \
              -keystore "./debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          test -f "./debug.keystore"

      - name: Handle google-services.json
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "app/google-services.json" ]; then
            if python3 - <<'PY'
          import json
          import sys

          path = "app/google-services.json"
          package_name = "com.aistudio.taherservicestudio.zqvmkl"

          try:
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception:
              sys.exit(1)

          for client in data.get("client", []):
              info = client.get("client_info", {})
              android = info.get("android_client_info", {})

              if android.get("package_name") == package_name:
                  sys.exit(0)

          sys.exit(1)
          PY
            then
              echo "Matching google-services.json found."
            else
              echo "Removing mismatched/invalid google-services.json."
              rm -f app/google-services.json
            fi
          else
            echo "No google-services.json found. Continuing."
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/debug \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -print \
            -quit)"

          test -n "$APK"

          echo "APK generated successfully:"
          echo "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: taher-service-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
